<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вид 01 — Сферический купол</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141c28'/><polygon points='16,4 28,16 16,28 4,16' fill='%23f59e0b' stroke='%2338bdf8' stroke-width='1.8'/><circle cx='16' cy='16' r='4.5' fill='%230b0f17' stroke='%2338bdf8' stroke-width='1.5'/><circle cx='25' cy='16' r='1.2' fill='%23f43f5e'/></svg>">
  <link rel="stylesheet" href="radType.css">
</head>
<body>

  <div class="app-screen">
    <header class="top-nav">
      <a href="radHub.html" class="nav-btn-back">‹</a>
      <span class="nav-title">Вид 01: Сферический купол</span>
      <button id="btn-clean" class="nav-clean">Clean</button>
    </header>

    <!-- Интерактивный чертеж -->
    <div class="blueprint-wrapper">
      <svg viewBox="0 0 340 170" class="blueprint-svg" id="svg-blueprint">
        <defs>
          <marker id="arr-c" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#38bdf8" />
          </marker>
          <marker id="arr-pink" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#ec4899" />
          </marker>
        </defs>

        <!-- Оси координат -->
        <line x1="260" y1="85" x2="260" y2="16" stroke="#475569" stroke-width="1.2" />
        <polygon points="257,18 260,11 263,18" fill="#475569" />
        <text x="266" y="20" fill="#64748b" font-size="10" font-family="monospace">X</text>

        <line x1="285" y1="85" x2="25" y2="85" stroke="#475569" stroke-width="1.2" />
        <polygon points="28,82 21,85 28,88" fill="#475569" />
        <text x="24" y="78" fill="#64748b" font-size="10" font-family="monospace">Z</text>
        <text x="264" y="98" fill="#64748b" font-size="10" font-family="monospace">Z0</text>

        <!-- Осевая линия детали -->
        <line x1="20" y1="85" x2="295" y2="85" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3" opacity="0.6" />

        <!-- Контур купола -->
        <path id="part-contour" d="M 45 85 L 45 35 L 205 35 A 55 55 0 0 1 260 85 Z" fill="#0e1726" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
        <path id="part-arc" d="M 205 35 A 55 55 0 0 1 260 85" fill="none" stroke="#fbbf24" stroke-width="2.8" />

        <!-- Опорные точки -->
        <circle id="pt-b" cx="205" cy="35" r="2.5" fill="#fbbf24" />
        <text id="lbl-b" x="200" y="26" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">B</text>

        <circle id="pt-a" cx="260" cy="85" r="2.5" fill="#f43f5e" />
        <text id="lbl-a" x="266" y="88" fill="#f43f5e" font-size="11" font-family="monospace" font-weight="700">A (Z0)</text>

        <!-- Размерная линия D -->
        <line id="dim-d" x1="36" y1="35" x2="36" y2="85" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d" x1="34" y1="35" x2="46" y2="35" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
        <text id="txt-d" x="28" y="64" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="end" font-weight="bold">D</text>

        <!-- Размерная линия L -->
        <line id="dim-l" x1="205" y1="125" x2="260" y2="125" stroke="#ec4899" stroke-width="1" marker-start="url(#arr-pink)" marker-end="url(#arr-pink)" />
        <line id="ext-l-b" x1="205" y1="35" x2="205" y2="130" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <line id="ext-l-a" x1="260" y1="85" x2="260" y2="130" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-l" x="232" y="121" fill="#ec4899" font-size="9.5" font-family="monospace" text-anchor="middle">L</text>

        <!-- Выноска R -->
        <line id="line-r" x1="205" y1="85" x2="238" y2="52" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2,2" />
        <circle id="pt-center" cx="205" cy="85" r="1.5" fill="#fbbf24" />
        <text id="txt-r-lbl" x="218" y="65" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">R</text>
      </svg>
    </div>

    <!-- Чекбокс опции кромки B -->
    <div class="edge-top-container">
      <div class="edge-top-row">
        <label class="check-inline">
          <input type="checkbox" id="chk-edge-b">
          <span style="font-weight: 600; color: #f1f5f9;">Кромка B (выход)</span>
        </label>
        <div class="edge-fields" id="edge-b-fields" style="display: none;">
          <div class="edge-switch">
            <button type="button" class="switch-btn active" id="btn-edge-g1" onclick="setEdgeMode('g1')">G1</button>
            <button type="button" class="switch-btn" id="btn-edge-arc" onclick="setEdgeMode('arc')">G2/3</button>
          </div>
          <div class="edge-input-box">
            <input type="text" inputmode="decimal" id="val-edge-b" placeholder="0.2">
          </div>
        </div>
      </div>
      <div class="hint-red" id="hint-edge-b">Отметьте чекбокс, если требуется фаска или скругление на кромке B</div>
    </div>

    <!-- 4 параметра (2x2): D, R, L, Пластина r -->
    <div class="param-grid">
      <div class="param-item">
        <span class="param-tag">D детали (Ø)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d" placeholder="напр. 6.0">
          <button type="button" class="btn-calc-sub" onclick="calcParam('D')" title="Рассчитать D">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">R сферы</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-r" placeholder="напр. 5.0">
          <button type="button" class="btn-calc-sub" onclick="calcParam('R')" title="Рассчитать R">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">L купола (Z)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-l" placeholder="напр. 1.0">
          <button type="button" class="btn-calc-sub" onclick="calcParam('L')" title="Рассчитать L">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">Пластина r (T3)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-cr" placeholder="опция (напр. 0.4)">
        </div>
      </div>
    </div>

    <!-- Дополнительно: Торец Z0 с кнопкой смены знака ± -->
    <div class="param-center-row">
      <div class="param-item param-item-mini">
        <span class="param-tag">Торец детали Z0 (мм)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-z0" value="0.0">
          <button type="button" class="btn-sign" onclick="toggleSign('in-z0')">±</button>
        </div>
      </div>
    </div>

    <!-- Переключатель Программа / Точки -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="tab-program" onclick="setViewMode('program')">Программа (Program)</button>
      <button class="mode-btn" id="tab-point" onclick="setViewMode('point')">Точки (Point)</button>
    </div>

    <!-- Кнопка расчета -->
    <button class="btn-calculate" id="btn-calc" onclick="calculate()">Рассчитать G-код</button>

    <div class="output-meta">
      <span class="meta-title">G-код Fanuc (G02)</span>
      <button class="action-link" id="btn-copy" onclick="copyCode()">📋 copy</button>
    </div>

    <div class="terminal-box">
      <pre id="output-box"><code>Нажмите «Рассчитать G-код»...</code></pre>
    </div>
  </div>

  <script src="radType1.js"></script>
</body>
</html>
