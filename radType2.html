<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вид 02 — Наружный радиус кромки</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141c28'/><polygon points='16,4 28,16 16,28 4,16' fill='%23f59e0b' stroke='%2338bdf8' stroke-width='1.8'/><circle cx='16' cy='16' r='4.5' fill='%230b0f17' stroke='%2338bdf8' stroke-width='1.5'/><circle cx='25' cy='16' r='1.2' fill='%23f43f5e'/></svg>">
  <link rel="stylesheet" href="radType.css">
</head>
<body>

  <div class="app-screen">
    <header class="top-nav">
      <a href="radHub.html" class="nav-btn-back">‹</a>
      <span class="nav-title">Вид 02: Наружный радиус</span>
      <button id="btn-clean" class="nav-clean">Clean</button>
    </header>

    <!-- Интерактивный чертеж -->
    <div class="blueprint-wrapper">
      <svg viewBox="0 0 340 170" class="blueprint-svg" id="svg-blueprint">
        <defs>
          <marker id="arr-c" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#38bdf8" />
          </marker>
          <marker id="arr-pink" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#ec4899" />
          </marker>
        </defs>

        <!-- Оси координат -->
        <line x1="260" y1="130" x2="260" y2="16" stroke="#475569" stroke-width="1.2" />
        <polygon points="257,18 260,11 263,18" fill="#475569" />
        <text x="266" y="20" fill="#64748b" font-size="10" font-family="monospace">X</text>

        <line x1="285" y1="130" x2="25" y2="130" stroke="#475569" stroke-width="1.2" />
        <polygon points="28,127 21,130 28,133" fill="#475569" />
        <text x="24" y="122" fill="#64748b" font-size="10" font-family="monospace">Z</text>
        <text x="264" y="142" fill="#64748b" font-size="10" font-family="monospace">Z0</text>

        <!-- Осевая линия -->
        <line x1="20" y1="130" x2="295" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3" opacity="0.6" />

        <!-- Контур детали и радиусные переходы -->
        <path id="part-contour" d="M 45 130 L 45 35 L 215 35 A 35 35 0 0 1 250 70 L 250 130 Z" fill="#0e1726" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
        <path id="part-arc-main" d="M 215 35 A 35 35 0 0 1 250 70" fill="none" stroke="#fbbf24" stroke-width="2.8" />
        <path id="part-arc-micro" d="" fill="none" stroke="#f43f5e" stroke-width="2.8" style="display: none;" />

        <!-- Точки C, B, A -->
        <g id="group-pts">
          <circle id="pt-c" cx="215" cy="35" r="2.5" fill="#fbbf24" />
          <text id="lbl-c" x="210" y="26" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">B</text>

          <circle id="pt-b" cx="238" cy="48" r="2.5" fill="#fbbf24" style="display: none;" />
          <text id="lbl-b" x="244" y="44" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700" style="display: none;">B</text>

          <circle id="pt-a" cx="250" cy="70" r="2.5" fill="#fbbf24" />
          <text id="lbl-a" x="256" y="74" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">A</text>
        </g>

        <!-- Размерная цепочка D1 -->
        <line id="dim-d1" x1="36" y1="35" x2="36" y2="130" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d1" x1="34" y1="35" x2="46" y2="35" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
        <text id="txt-d1" x="28" y="86" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="end" font-weight="bold">D1</text>

        <!-- Размерная цепочка d2 -->
        <line id="dim-d2" x1="285" y1="70" x2="285" y2="130" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d2" x1="250" y1="70" x2="292" y2="70" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" stroke-dasharray="2,2" />
        <text id="txt-d2" x="294" y="103" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">d2</text>

        <!-- Размерная цепочка L1 -->
        <line id="dim-l1" x1="215" y1="150" x2="250" y2="150" stroke="#ec4899" stroke-width="1" marker-start="url(#arr-pink)" marker-end="url(#arr-pink)" />
        <line id="ext-l1-b" x1="215" y1="35" x2="215" y2="155" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <line id="ext-l1-a" x1="250" y1="70" x2="250" y2="155" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-l1" x="232" y="146" fill="#ec4899" font-size="9.5" font-family="monospace" text-anchor="middle">L1</text>

        <!-- Выноски R1 и R2 -->
        <line id="line-r1" x1="215" y1="70" x2="232" y2="52" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2,2" />
        <text id="txt-r1-lbl" x="202" y="78" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">R1</text>
        
        <g id="group-r2-lbl" style="display: none;">
          <line id="line-r2" x1="248" y1="62" x2="238" y2="56" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2" />
          <text id="txt-r2-lbl" x="228" y="54" fill="#f43f5e" font-size="9.5" font-family="monospace" font-weight="bold">R2</text>
        </g>
      </svg>
    </div>

    <!-- Верхние опции: пластина r (T3) слева, R2 (торец) справа -->
    <div class="options-row">
      <div class="option-item">
        <label class="check-inline">
          <input type="checkbox" id="chk-cr">
          <span>r пластины (T3)</span>
        </label>
        <div class="edge-input-box" id="box-cr" style="display: none;">
          <input type="text" inputmode="decimal" id="val-cr" placeholder="0.3">
        </div>
      </div>

      <div class="option-item">
        <label class="check-inline">
          <input type="checkbox" id="chk-r2">
          <span>R2 (торец)</span>
        </label>
        <div class="edge-input-box" id="box-r2" style="display: none;">
          <input type="text" inputmode="decimal" id="val-r2" placeholder="0.2">
        </div>
      </div>
    </div>

    <!-- 4 параметра геометрии (2x2) -->
    <div class="param-grid">
      <div class="param-item">
        <span class="param-tag">D1 детали</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d1" placeholder="5">
          <button type="button" class="btn-calc-sub" onclick="calcParam('D1')" title="Рассчитать D1">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">d2 начала</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d2" placeholder="2">
          <button type="button" class="btn-calc-sub" onclick="calcParam('d2')" title="Рассчитать d2">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">R1 радиус</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-r1" placeholder="1.083">
          <button type="button" class="btn-calc-sub" onclick="calcParam('R1')" title="Рассчитать R1">🧮</button>
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">L1 длина по Z</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-l1" placeholder="0.999">
          <button type="button" class="btn-calc-sub" onclick="calcParam('L1')" title="Рассчитать L1">🧮</button>
        </div>
      </div>
    </div>

    <div class="hint-red" style="text-align: center; margin-bottom: 8px;">Заполните любые 3 параметра из 4 (4-й рассчитывается кнопкой 🧮)</div>

    <!-- Переключатель Программа / Точки -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="tab-program" onclick="setViewMode('program')">Программа (Program)</button>
      <button class="mode-btn" id="tab-point" onclick="setViewMode('point')">Точки (Point)</button>
    </div>

    <button class="btn-calculate" id="btn-calc" onclick="calculate()">Рассчитать G-код</button>

    <div class="output-meta">
      <span class="meta-title">G-код Fanuc</span>
      <button class="action-link" id="btn-copy" onclick="copyCode()">📋 copy</button>
    </div>

    <div class="terminal-box">
      <pre id="output-box"><code>Нажмите «Рассчитать G-код»...</code></pre>
    </div>
  </div>

  <script src="radType2.js"></script>
</body>
</html>
