<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вид 03 — Внутренняя галтель уступа</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141c28'/><polygon points='16,4 28,16 16,28 4,16' fill='%23f59e0b' stroke='%2338bdf8' stroke-width='1.8'/><circle cx='16' cy='16' r='4.5' fill='%230b0f17' stroke='%2338bdf8' stroke-width='1.5'/><circle cx='25' cy='16' r='1.2' fill='%23f43f5e'/></svg>">
  <link rel="stylesheet" href="radType.css">
</head>
<body>

  <div class="app-screen">
    <header class="top-nav">
      <a href="radHub.html" class="nav-btn-back">‹</a>
      <span class="nav-title">Вид 03: Внутренняя галтель</span>
      <button id="btn-clean" class="nav-clean">Clean</button>
    </header>

    <!-- Интерактивный чертеж -->
    <div class="blueprint-wrapper">
      <svg viewBox="0 0 340 170" class="blueprint-svg" id="svg-blueprint">
        <defs>
          <marker id="arr-c" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#38bdf8" />
          </marker>
          <marker id="arr-pink" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#ec4899" />
          </marker>
        </defs>

        <line x1="260" y1="130" x2="260" y2="16" stroke="#475569" stroke-width="1.2" />
        <polygon points="257,18 260,11 263,18" fill="#475569" />
        <text x="266" y="20" fill="#64748b" font-size="10" font-family="monospace">X</text>

        <line x1="285" y1="130" x2="25" y2="130" stroke="#475569" stroke-width="1.2" />
        <polygon points="28,127 21,130 28,133" fill="#475569" />
        <text x="24" y="122" fill="#64748b" font-size="10" font-family="monospace">Z</text>
        <text x="264" y="142" fill="#64748b" font-size="10" font-family="monospace">Z0</text>

        <line x1="20" y1="130" x2="295" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3" opacity="0.6" />

        <path id="part-contour" d="M 45 130 L 45 35 L 140 35 L 140 60 A 25 25 0 0 0 165 85 L 260 85 L 260 130 Z" fill="#0e1726" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
        <path id="part-arc" d="M 165 85 A 25 25 0 0 1 140 60" fill="none" stroke="#fbbf24" stroke-width="2.8" />

        <circle id="pt-a" cx="165" cy="85" r="2.5" fill="#fbbf24" />
        <text id="lbl-a" x="168" y="96" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">A</text>

        <circle id="pt-b" cx="140" cy="60" r="2.5" fill="#fbbf24" />
        <text id="lbl-b" x="128" y="58" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">B</text>

        <circle id="pt-c" cx="140" cy="35" r="2.5" fill="#38bdf8" />
        <text id="lbl-c" x="128" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="700">C</text>

        <line id="dim-d" x1="36" y1="35" x2="36" y2="130" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d" x1="34" y1="35" x2="46" y2="35" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
        <text id="txt-d" x="28" y="86" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="end" font-weight="bold">D</text>

        <line id="dim-d-small" x1="285" y1="85" x2="285" y2="130" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d-small" x1="260" y1="85" x2="292" y2="85" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" stroke-dasharray="2,2" />
        <text id="txt-d-small" x="294" y="110" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">d</text>

        <line id="dim-l" x1="140" y1="150" x2="260" y2="150" stroke="#ec4899" stroke-width="1" marker-start="url(#arr-pink)" marker-end="url(#arr-pink)" />
        <line id="ext-l-shoulder" x1="140" y1="35" x2="140" y2="155" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <line id="ext-l-face" x1="260" y1="85" x2="260" y2="155" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-l" x="200" y="146" fill="#ec4899" font-size="9.5" font-family="monospace" text-anchor="middle">L</text>

        <line id="line-r" x1="140" y1="85" x2="158" y2="67" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2,2" />
        <circle id="pt-center" cx="140" cy="85" r="1.5" fill="#fbbf24" />
        <text id="txt-r-lbl" x="144" y="74" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">R</text>
      </svg>
    </div>

    <!-- 4 параметра геометрии (2x2) -->
    <div class="param-grid">
      <div class="param-item">
        <span class="param-tag">D детали (буртик Ø)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d-big" placeholder="напр. 12">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">d шейки (Ø)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d-small" placeholder="напр. 5.5">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">L длина до буртика</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-l" placeholder="напр. 12">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">R скругления</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-r" placeholder="напр. 1.0">
        </div>
      </div>
    </div>

    <!-- Симметричная строка: r пластины (T3) слева, Торец Z0 справа -->
    <div class="options-row" style="margin-bottom: 10px;">
      <div class="option-item">
        <label class="check-inline">
          <input type="checkbox" id="chk-cr">
          <span>r пластины (T3)</span>
        </label>
        <div class="edge-input-box" id="box-cr" style="display: none;">
          <input type="text" inputmode="decimal" id="val-cr" placeholder="0.4">
        </div>
      </div>

      <div class="option-item">
        <span class="param-tag" style="font-size: 11px;">Торец Z0 (мм)</span>
        <div class="edge-input-box" style="width: 76px; display: flex; align-items: center; padding: 0;">
          <input type="text" inputmode="decimal" id="in-z0" placeholder="0.0" style="width: 48px; padding: 2px 0;">
          <button type="button" class="btn-sign" onclick="toggleSign('in-z0')" style="padding: 0 4px; font-size: 13px;">±</button>
        </div>
      </div>
    </div>

    <!-- Переключатель Программа / Точки -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="tab-program" onclick="setViewMode('program')">Программа (Program)</button>
      <button class="mode-btn" id="tab-point" onclick="setViewMode('point')">Точки (Point)</button>
    </div>

    <button class="btn-calculate" id="btn-calc" onclick="calculate()">Рассчитать G-код</button>

    <div class="output-meta">
      <span class="meta-title">G-код Fanuc (G02)</span>
      <button class="action-link" id="btn-copy" onclick="copyCode()">📋 copy</button>
    </div>

    <div class="terminal-box">
      <pre id="output-box"><code>Нажмите «Рассчитать G-код»...</code></pre>
    </div>
  </div>

  <script src="radType3.js"></script>
</body>
</html>
