<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вид 04 — Сферическая головка винта</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141c28'/><polygon points='16,4 28,16 16,28 4,16' fill='%23f59e0b' stroke='%2338bdf8' stroke-width='1.8'/><circle cx='16' cy='16' r='4.5' fill='%230b0f17' stroke='%2338bdf8' stroke-width='1.5'/><circle cx='25' cy='16' r='1.2' fill='%23f43f5e'/></svg>">
  <link rel="stylesheet" href="radType.css">
</head>
<body>

  <div class="app-screen">
    <header class="top-nav">
      <a href="radHub.html" class="nav-btn-back">‹</a>
      <span class="nav-title">Вид 04: Головка винта</span>
      <button id="btn-clean" class="nav-clean">Clean</button>
    </header>

    <!-- Интерактивный чертеж с правильной сноской R -->
    <div class="blueprint-wrapper">
      <svg viewBox="0 0 340 170" class="blueprint-svg" id="svg-blueprint">
        <defs>
          <marker id="arr-c" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#38bdf8" />
          </marker>
          <marker id="arr-pink" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#ec4899" />
          </marker>
          <marker id="arr-yellow" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L5,3 L0,5 z" fill="#fbbf24" />
          </marker>
        </defs>

        <line x1="290" y1="115" x2="30" y2="115" stroke="#475569" stroke-width="1.2" />
        <polygon points="33,112 26,115 33,118" fill="#475569" />
        <text x="28" y="106" fill="#64748b" font-size="10" font-family="monospace">Z</text>

        <line x1="20" y1="115" x2="310" y2="115" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3" opacity="0.6" />

        <path id="part-contour" d="M 85 115 A 55 55 0 0 1 113 67 L 135 67 L 135 93 L 275 93 L 275 115 Z" fill="#0e1726" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
        <path id="part-arc" d="M 85 115 A 55 55 0 0 1 113 67" fill="none" stroke="#fbbf24" stroke-width="2.8" />

        <!-- Опорные точки контура: только C и A -->
        <circle id="pt-c" cx="85" cy="115" r="2.5" fill="#fbbf24" />
        <text id="lbl-c" x="72" y="126" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">C</text>

        <circle id="pt-a" cx="113" cy="67" r="2.5" fill="#fbbf24" />
        <text id="lbl-a" x="110" y="58" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700">A</text>

        <!-- Размеры D1, l, L -->
        <line id="dim-d" x1="40" y1="67" x2="40" y2="115" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-d" x1="38" y1="67" x2="113" y2="67" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-d" x="32" y="94" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="end" font-weight="bold">D1</text>

        <line id="dim-len-head" x1="85" y1="133" x2="135" y2="133" stroke="#ec4899" stroke-width="1" marker-start="url(#arr-pink)" marker-end="url(#arr-pink)" />
        <line id="ext-lh-tip" x1="85" y1="115" x2="85" y2="138" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <line id="ext-lh-sh" x1="135" y1="93" x2="135" y2="138" stroke="#ec4899" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-lh" x="110" y="130" fill="#ec4899" font-size="9.5" font-family="monospace" text-anchor="middle">l</text>

        <line id="dim-l" x1="85" y1="152" x2="275" y2="152" stroke="#38bdf8" stroke-width="1" marker-start="url(#arr-c)" marker-end="url(#arr-c)" />
        <line id="ext-l-end" x1="275" y1="93" x2="275" y2="157" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2" />
        <text id="txt-l" x="180" y="148" fill="#38bdf8" font-size="9.5" font-family="monospace" text-anchor="middle">L</text>

        <!-- Чертёжная выноска (сноска) радиуса R со стрелкой к дуге -->
        <path id="leader-r" d="M 60 52 L 78 52 L 96 80" fill="none" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arr-yellow)" />
        <text id="txt-r-lbl" x="66" y="48" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">R</text>
      </svg>
    </div>

    <!-- Основные 4 параметра геометрии (2x2): D1, L, l, R -->
    <div class="param-grid">
      <div class="param-item">
        <span class="param-tag">D1 головки (Ø)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d" placeholder="напр. 5.4">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">L длина детали</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-l" placeholder="напр. 7">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">l высота головы</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-len-head" placeholder="напр. 1.5">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">R сферы</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-r" placeholder="напр. 4">
        </div>
      </div>
    </div>

    <!-- Технологические параметры: r (пластина), n (отрезка) -->
    <div class="param-grid" style="margin-bottom: 8px;">
      <div class="param-item">
        <span class="param-tag">r радиус пластины</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-cr" placeholder="напр. 1">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">n толщина отрезки</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-n" placeholder="напр. 0.5">
        </div>
      </div>
    </div>

    <!-- Xa (диаметр зареза) и Торец Z0 в аккуратной симметричной строке -->
    <div class="param-grid" style="margin-bottom: 10px;">
      <div class="param-item">
        <span class="param-tag">Xa диаметр зареза</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-xa" placeholder="напр. 1.2">
        </div>
      </div>

      <div class="param-item">
        <span class="param-tag">Торец детали Z0 (мм)</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-z0" placeholder="0.0">
          <button type="button" class="btn-sign" onclick="toggleSign('in-z0')">±</button>
        </div>
      </div>
    </div>

    <!-- Переключатель Программа / Точки -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="tab-program" onclick="setViewMode('program')">Программа (Program)</button>
      <button class="mode-btn" id="tab-point" onclick="setViewMode('point')">Точки (Point)</button>
    </div>

    <button class="btn-calculate" id="btn-calc" onclick="calculate()">Рассчитать G-код</button>

    <div class="output-meta">
      <span class="meta-title">G-код Fanuc (G03)</span>
      <button class="action-link" id="btn-copy" onclick="copyCode()">📋 copy</button>
    </div>

    <div class="terminal-box">
      <pre id="output-box"><code>Нажмите «Рассчитать G-код»...</code></pre>
    </div>
  </div>

  <script src="radType4.js"></script>
</body>
</html>
