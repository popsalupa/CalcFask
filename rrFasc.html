<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141c28'/><polygon points='16,4 28,16 16,28 4,16' fill='%23f59e0b' stroke='%2338bdf8' stroke-width='1.8'/><circle cx='16' cy='16' r='4.5' fill='%230b0f17' stroke='%2338bdf8' stroke-width='1.5'/><circle cx='25' cy='16' r='1.2' fill='%23f43f5e'/></svg>">
  <title>Type 2 — Задняя фаска</title>
  <link rel="stylesheet" href="rrFasc.css">
</head>
<body>

<!-- CNC Preloader -->
<div id="preloader" class="cnc-preloader">
  <div class="loader-container">
    <svg viewBox="0 0 200 120" class="lathe-animation">
      <!-- Патрон / Шпиндель слева -->
      <rect x="10" y="32" width="22" height="56" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="32" y="38" width="10" height="44" fill="#334155" />

      <!-- Заготовка (пруток) -->
      <defs>
        <!-- Текстура вращения детали -->
        <pattern id="lathe-spin" width="12" height="40" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="40" stroke="#475569" stroke-width="2.5" opacity="0.4" />
          <line x1="6" y1="0" x2="6" y2="40" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" />
        </pattern>
      </defs>
      
      <!-- Необработанная часть детали -->
      <rect x="42" y="42" width="55" height="36" rx="1" fill="#334155" stroke="#475569" stroke-width="1.2" />
      <!-- Проточенная начисто часть -->
      <rect x="97" y="48" width="60" height="24" rx="1" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      
      <!-- Полосы вращения заготовки -->
      <g class="rotating-stock">
        <rect x="43" y="43" width="53" height="34" fill="url(#lathe-spin)" />
      </g>

      <!-- Державка резца (Toolholder) -->
      <path d="M 120 78 L 138 96 L 155 96 L 135 78 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

      <!-- Ромбическая пластина (Insert) -->
      <polygon points="106,60 118,60 126,72 114,72" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="116" cy="66" r="2.2" fill="#0f172a" />

      <!-- Точка резания / свечение -->
      <circle cx="106" cy="60" r="3" fill="#f43f5e" class="cutting-glow" />

      <!-- Вылетающая спиральная стружка -->
      <path d="M 106 59 Q 102 50 108 42 T 114 32" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round" class="flying-chip" />
      <path d="M 106 59 Q 112 48 105 38" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" class="flying-chip chip-delay" />

      <!-- Искры -->
      <circle cx="103" cy="54" r="1" fill="#fbbf24" class="spark s1" />
      <circle cx="108" cy="52" r="0.8" fill="#f43f5e" class="spark s2" />
      <circle cx="101" cy="48" r="1.2" fill="#facc15" class="spark s3" />
    </svg>

    <div class="loader-caption">
      <span class="loader-title">ЧПУ ОБРАБОТКА</span>
      <span class="loader-sub">Инициализация режимов...</span>
    </div>
  </div>
</div>

  <div class="app-screen">
    <!-- Шапка -->
    <header class="top-nav">
      <a href="index.html" class="nav-btn-back">‹</a>
      <span class="nav-title">Type 2</span>
      <button id="btn-clean" class="nav-clean">Clean</button>
    </header>

    <!-- Интерактивный чертёж SVG с динамической сменой контуров -->
    <div class="blueprint-wrapper">
      <svg viewBox="0 0 340 170" class="blueprint-svg">
        <!-- Координатные оси -->
        <line x1="80" y1="85" x2="35" y2="85" stroke="#64748b" stroke-width="1.2" />
        <polygon points="35,82 29,85 35,88" fill="#64748b" />
        <line x1="80" y1="85" x2="80" y2="20" stroke="#64748b" stroke-width="1.2" />
        <polygon points="77,20 80,14 83,20" fill="#64748b" />
        <text x="24" y="88" fill="#94a3b8" font-size="10" font-family="monospace">Z</text>
        <text x="76" y="12" fill="#94a3b8" font-size="10" font-family="monospace">X</text>
        <text x="84" y="94" fill="#94a3b8" font-size="10">O</text>

        <!-- Осевая линия детали -->
        <line x1="45" y1="85" x2="280" y2="85" stroke="#94a3b8" stroke-dasharray="7,3,2,3" stroke-width="1" />

        <!-- 1. Базовый контур без скруглений -->
        <g id="contour-simple">
          <polygon points="250,26 155,26 110,60 110,110 155,144 250,144" fill="none" stroke="#38bdf8" stroke-width="2" />
          <circle cx="155" cy="26" r="2.5" fill="#f59e0b" />
          <circle cx="110" cy="60" r="2.5" fill="#f59e0b" />
          <text x="158" y="20" fill="#f59e0b" font-weight="700" font-size="11">B</text>
          <text x="96" y="58" fill="#f59e0b" font-weight="700" font-size="11">A</text>
        </g>

        <!-- 2. Скругленный контур (R1 вход, R2 выход) -->
        <g id="contour-micro" style="display: none;">
          <path d="M 250,26 L 165,26 Q 155,26 150,31 L 118,55 Q 110,61 110,70 L 110,100 Q 110,109 118,115 L 150,139 Q 155,144 165,144 L 250,144" fill="none" stroke="#38bdf8" stroke-width="2" />
          <text x="166" y="20" fill="#f59e0b" font-weight="700" font-size="11">D</text>
          <text x="146" y="24" fill="#f59e0b" font-weight="700" font-size="11">C</text>
          <text x="118" y="50" fill="#f59e0b" font-weight="700" font-size="11">B</text>
          <text x="96" y="72" fill="#f59e0b" font-weight="700" font-size="11">A</text>
          
          <!-- Подсветка выноски R1 (вход) -->
          <g id="lbl-r1-svg" style="display: none;">
            <path d="M 155,28 Q 152,14 140,12" fill="none" stroke="#ef4444" stroke-width="1" />
            <text x="122" y="14" fill="#ef4444" font-size="10" font-weight="700" font-family="monospace">R1</text>
          </g>

          <!-- Подсветка выноски R2 (выход) -->
          <g id="lbl-r2-svg" style="display: none;">
            <path d="M 110,68 Q 104,58 92,52" fill="none" stroke="#ef4444" stroke-width="1" />
            <text x="76" y="52" fill="#ef4444" font-size="10" font-weight="700" font-family="monospace">R2</text>
          </g>
        </g>

        <line x1="250" y1="26" x2="250" y2="144" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="110" y1="60" x2="110" y2="110" stroke="#38bdf8" stroke-width="1.5" />

        <!-- Размер D1 -->
        <line x1="265" y1="26" x2="265" y2="144" stroke="#f43f5e" stroke-width="1" />
        <line x1="250" y1="26" x2="270" y2="26" stroke="#f43f5e" stroke-width="0.8" />
        <line x1="250" y1="144" x2="270" y2="144" stroke="#f43f5e" stroke-width="0.8" />
        <text x="272" y="89" fill="#f43f5e" font-size="10" font-family="monospace">D1</text>

        <!-- Размер d2 -->
        <line x1="95" y1="60" x2="95" y2="110" stroke="#f43f5e" stroke-width="1" />
        <line x1="90" y1="60" x2="110" y2="60" stroke="#f43f5e" stroke-width="0.8" />
        <line x1="90" y1="110" x2="110" y2="110" stroke="#f43f5e" stroke-width="0.8" />
        <text x="76" y="89" fill="#f43f5e" font-size="10" font-family="monospace">d2</text>

        <!-- Размер l1 -->
        <line x1="110" y1="156" x2="155" y2="156" stroke="#ec4899" stroke-width="1" />
        <line x1="110" y1="110" x2="110" y2="161" stroke="#ec4899" stroke-width="0.8" />
        <line x1="155" y1="144" x2="155" y2="161" stroke="#ec4899" stroke-width="0.8" />
        <text x="128" y="153" fill="#ec4899" font-size="10" font-family="monospace">l1</text>

        <!-- Угол Angle 1 -->
        <line x1="110" y1="60" x2="160" y2="60" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2" />
        <path d="M 140 60 A 30 30 0 0 0 133 46" fill="none" stroke="#a855f7" stroke-width="1.2" />
        <text x="146" y="52" fill="#a855f7" font-size="9" font-family="monospace">Angle1</text>
      </svg>
    </div>

    <!-- Чекбоксы R1 (вход) и R2 (выход на d2) -->
    <div class="micro-row">
      <!-- R1 блок -->
      <div class="micro-cell">
        <div class="chk-line">
          <label class="check-label">
            <input type="checkbox" id="chk-r1">
            <span class="custom-box"></span>
            <span>R1 (вход)</span>
          </label>
          <div class="mode-switch" id="switch-r1" style="display: none;">
            <button type="button" class="mode-btn active" id="btn-r1-g1" onclick="toggleMicroMode('r1', 'g1')">G1</button>
            <button type="button" class="mode-btn" id="btn-r1-arc" onclick="toggleMicroMode('r1', 'arc')">G2/3</button>
          </div>
        </div>
        <input type="text" inputmode="decimal" id="val-r1" class="micro-val-input" placeholder="0.0" style="display: none;">
      </div>

      <!-- R2 блок -->
      <div class="micro-cell">
        <div class="chk-line">
          <label class="check-label">
            <input type="checkbox" id="chk-r2">
            <span class="custom-box"></span>
            <span>R2 (выход)</span>
          </label>
          <div class="mode-switch" id="switch-r2" style="display: none;">
            <button type="button" class="mode-btn active" id="btn-r2-g1" onclick="toggleMicroMode('r2', 'g1')">G1</button>
            <button type="button" class="mode-btn" id="btn-r2-arc" onclick="toggleMicroMode('r2', 'arc')">G2/3</button>
          </div>
        </div>
        <input type="text" inputmode="decimal" id="val-r2" class="micro-val-input" placeholder="0.0" style="display: none;">
      </div>
    </div>
    <div class="red-hint">Отметьте чекбокс, если требуются микроэлементы R1 / R2</div>

    <!-- 4 параметра геометрии (2x2) -->
    <div class="param-grid">
      <!-- D1 -->
      <div class="param-item">
        <span class="param-tag">D1</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d1" placeholder="">
          <button class="btn-calc-sub" onclick="calcParam('D1')">🧮</button>
        </div>
      </div>

      <!-- d2 -->
      <div class="param-item">
        <span class="param-tag">d2</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-d2" placeholder="">
          <button class="btn-calc-sub" onclick="calcParam('d2')">🧮</button>
        </div>
      </div>

      <!-- Angle 1 -->
      <div class="param-item">
        <span class="param-tag">Angle 1</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-angle" placeholder="">
          <button class="btn-calc-sub" onclick="calcParam('angle')">🧮</button>
        </div>
      </div>

      <!-- l1 -->
      <div class="param-item">
        <span class="param-tag">l1</span>
        <div class="param-input-box">
          <input type="text" inputmode="decimal" id="in-l1" placeholder="">
          <button class="btn-calc-sub" onclick="calcParam('l1')">🧮</button>
        </div>
      </div>
    </div>
    <div class="red-hint text-center">Заполните минимум 3 параметра из 4</div>

    <!-- Дополнительные параметры: L детали, W пластины, БП -->
    <div class="setting-line">
      <span class="setting-label">Длина детали L (мм)</span>
      <div class="setting-input-wrap">
        <input type="text" inputmode="decimal" id="in-len-l" placeholder="">
      </div>
    </div>

    <div class="setting-line">
      <span class="setting-label">Толщина пластины W (мм)</span>
      <div class="setting-input-wrap">
        <input type="text" inputmode="decimal" id="in-width-w" placeholder="">
      </div>
    </div>

    <div class="setting-line">
      <span class="setting-label">Безопасный подход (БП, диаметр)</span>
      <div class="setting-input-wrap">
        <input type="text" inputmode="decimal" id="in-bp" placeholder="">
      </div>
    </div>

    <!-- Кнопки режимов Point / Program и Calculation -->
    <div class="controls-row">
      <div class="tab-group">
        <button id="tab-point" class="tab-btn" onclick="setViewMode('point')">Point</button>
        <button id="tab-program" class="tab-btn active" onclick="setViewMode('program')">Program</button>
      </div>
      <button id="btn-calculation" class="btn-calculate" onclick="performCalculation()">Calculation</button>
    </div>

    <!-- Экспорт / Копирование -->
    <div class="output-meta">
      <span class="meta-title">Траектория обработки</span>
      <div class="meta-actions">
        <button class="action-link" onclick="exportFile()">⎘ export</button>
        <button class="action-link" onclick="copyProgram()">📋 copy</button>
      </div>
    </div>

    <!-- Терминал G-кода -->
    <div class="terminal-box">
      <pre id="output-box"><code></code></pre>
    </div>
  </div>

  <script src="rrFasc.js"></script>
</body>
</html>
